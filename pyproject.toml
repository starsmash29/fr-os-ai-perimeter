[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-os-ai-perimeter"
version = "0.1.0"
description = "FR_OS AI-Perimeter: natural-language firewall changes as validated, admin-approved config patches, plus local anomaly explanations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    # FR_OS at the state it was in when the hackathon started (the
    # `hackathon-start` tag of the working copy). Pinned to a commit, never a
    # branch: the router never installs anything unpinned.
    "frfw @ git+https://github.com/starsmash29/fr_os-hackathon@815576493ca8c6512244bae9b482d6923c575650",
]

[project.scripts]
ai-perimeter-chat = "ai_perimeter.cli:main"
fr-ai-assist = "ai_perimeter.service:main"
fr-webui-ai = "ai_perimeter.webui.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# The AI-Perimeter screen runs inside FR_OS's webUI: FR_OS's own webUI
# extra (FastAPI, Jinja2, ...), same pinned commit. Nothing new.
webui = [
    "frfw[webui] @ git+https://github.com/starsmash29/fr_os-hackathon@815576493ca8c6512244bae9b482d6923c575650",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_perimeter = ["webui/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
