# FR_OS AI-Perimeter: run FR_OS's webUI with the AI-Perimeter screen.
#
# Only the command changes. fr-webui-ai runs FR_OS's own fr-webui code (same
# arguments, TLS, listen addresses) and adds the screen in memory, so no
# FR_OS file is modified and FR_OS's integrity check stays clean (SEC-15).
# The account and the sandbox are FR_OS's unit's, untouched (A1, I1).
# install.sh refuses to install this unless FR_OS's ExecStart is the plain
# `fr-webui` this replaces. `install.sh --uninstall` removes it.
[Service]
ExecStart=
ExecStart=fr-webui-ai
